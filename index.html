<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pet Feeder Dashboard</title>
  <style>
    /* CSS: Muted / Slate Color Scheme */
    :root {
      --primary-color: #475569;
      --primary-hover: #334155;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .dashboard-card {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 40px 36px 48px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 10px;
      color: var(--text-main);
      font-weight: 700;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background-color: #e2e8f0;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    /* Custom Toast Notification Banner */
    .toast-banner {
      display: none;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .select-label {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .select-dropdown {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #f8fafc;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .select-dropdown:focus {
      border-color: var(--primary-color);
    }

    .dispense-button {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 6px;
    }

    .dispense-button:hover {
      background-color: var(--primary-hover);
    }

    .dispense-button:active {
      transform: scale(0.99);
    }

    .secondary-button {
      background-color: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secondary-button:hover {
      background-color: #f8fafc;
      color: var(--text-main);
    }

    /* Log View Styling */
    .log-container {
      display: none;
      text-align: left;
    }

    .log-list {
      list-style: none;
      padding: 0;
      margin: 18px 0;
      max-height: 280px;
      overflow-y: auto;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #f8fafc;
    }

    .log-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      color: var(--text-main);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-empty {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Bottom Left Version Tag */
    .version-tag {
      position: absolute;
      bottom: 14px;
      left: 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>

  <!-- Firebase Web SDK Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="dashboard-card">
    <h1>🐾 Smart Pet Feeder</h1>
    <div class="status-badge" id="status">Offline (Demo Mode)</div>

    <!-- Custom Notification Banner -->
    <div id="toastBanner" class="toast-banner"></div>

    <!-- Main Controls View -->
    <div id="controlsView" class="control-group">
      <label class="select-label" for="revSelect">Portion Size (Revolutions):</label>
      <select id="revSelect" class="select-dropdown">
        <option value="1">1 Revolution</option>
        <option value="2">2 Revolutions</option>
        <option value="3">3 Revolutions</option>
        <option value="4">4 Revolutions</option>
      </select>

      <button class="dispense-button" onclick="triggerDispense()">Dispense</button>
      <button class="secondary-button" onclick="showLogView()">Feed Log</button>
    </div>

    <!-- Feed Log View -->
    <div id="logView" class="log-container">
      <label class="select-label">Recent Dispense Activity (PST):</label>
      <ul id="logList" class="log-list">
        <li class="log-empty">Loading logs from database...</li>
      </ul>
      <button class="secondary-button" onclick="showControlsView()">← Back to Controls</button>
    </div>

    <!-- Version Indicator -->
    <div class="version-tag">Ver 1.0.5</div>
  </div>

  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCwRSWrUoNP7JrGyqEVspQaxKPn8zuib1I",
      authDomain: "dog-feeder-63c72.firebaseapp.com",
      databaseURL: "https://dog-feeder-63c72-default-rtdb.firebaseio.com",
      projectId: "dog-feeder-63c72",
      storageBucket: "dog-feeder-63c72.firebasestorage.app",
      messagingSenderId: "804213473474",
      appId: "1:804213473474:web:e57bbd74bddd998bc73b5b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const logsRef = db.ref("feed_logs");

    // Listen for Realtime Database Updates
    logsRef.limitToLast(10).on("value", (snapshot) => {
      const logListElement = document.getElementById("logList");
      const data = snapshot.val();

      if (!data) {
        logListElement.innerHTML = '<li class="log-empty">No dispense records yet.</li>';
        return;
      }

      // Convert Firebase object into an array and reverse so newest is at the top
      const logsArray = Object.values(data).reverse();

      logListElement.innerHTML = logsArray.map(log => `
        <li class="log-item">
          <span>${log.time}</span>
          <strong>${log.revs} Rev${log.revs > 1 ? 's' : ''}</strong>
        </li>
      `).join('');
    });

    function triggerDispense() {
      const revs = document.getElementById('revSelect').value;
      
      // Get current date & time formatted in PST down to the minute
      const now = new Date();
      const options = {
        timeZone: 'America/Los_Angeles',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      const pstTimeString = now.toLocaleString('en-US', options);

      // Push new log entry into Firebase Realtime Database
      logsRef.push({
        time: pstTimeString,
        revs: revs,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      // Cleanup: Keep only the 10 most recent logs in Firebase
      logsRef.once("value", (snapshot) => {
        const total = snapshot.numChildren();
        if (total > 10) {
          let count = 0;
          snapshot.forEach((child) => {
            if (count < total - 10) {
              logsRef.child(child.key).remove();
            }
            count++;
          });
        }
      });

      // Show in-app banner alert
      showToast(`Food Dispensed! (${revs} Rev${revs > 1 ? 's' : ''})`);
    }

    function showToast(message) {
      const toast = document.getElementById('toastBanner');
      toast.innerText = message;
      toast.style.display = 'block';

      // Automatically hide after 3 seconds
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    function showLogView() {
      document.getElementById('controlsView').style.display = 'none';
      document.getElementById('logView').style.display = 'block';
    }

    function showControlsView() {
      document.getElementById('logView').style.display = 'none';
      document.getElementById('controlsView').style.display = 'flex';
    }
  </script>

</body>
</html>
