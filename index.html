<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Feeder</title>
<style>
  :root{--bg:#2b3138;--card:#363d46;--line:#4a535e;--text:#e3e7eb;--muted:#9aa5b1;--accent:#7f9bb3;--ok:#7fae93;--warn:#c9a46b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  h1{font-size:1.3rem;font-weight:600;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .toggle{display:flex;background:var(--bg);border-radius:10px;padding:4px}
  .toggle button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:.95rem;cursor:pointer}
  .toggle button.active{background:var(--accent);color:#14181c;font-weight:600}
  .portions{display:flex;gap:10px}
  .portions button{flex:1;padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1.1rem;cursor:pointer}
  .portions button.active{border-color:var(--accent);background:var(--accent);color:#14181c;font-weight:700}
  .dispense{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ok);color:#14181c;font-size:1.05rem;font-weight:700;cursor:pointer}
  .dispense:disabled{opacity:.5}
  .status{margin-top:10px;font-size:.85rem;color:var(--muted);min-height:1.2em}
  .log{list-style:none;margin:0;padding:0}
  .log li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .log li:last-child{border-bottom:0}
  .log .r{color:var(--muted)}
  .log .local{color:var(--warn)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.show{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:320px}
  .modal h2{margin:0 0 12px;font-size:1.05rem}
  .modal input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;margin-bottom:8px;text-transform:uppercase}
  .err{color:#d98a8a;font-size:.82rem;min-height:1.1em;margin-bottom:8px}
  .row{display:flex;gap:10px}
  .row button{flex:1;padding:11px;border-radius:8px;border:0;font-size:.95rem;cursor:pointer}
  .cancel{background:var(--line);color:var(--text)}
  .confirm{background:var(--accent);color:#14181c;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐶 Dog Feeder</h1>

  <div class="card">
    <div class="label">Mode</div>
    <div class="toggle">
      <button id="modeOnline" class="active">Online</button>
      <button id="modeOffline">Offline</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Portion (revolutions)</div>
    <div class="portions" id="portions">
      <button data-revs="1" class="active">1</button>
      <button data-revs="2">2</button>
      <button data-revs="3">3</button>
    </div>
  </div>

  <div class="card">
    <button class="dispense" id="dispenseBtn">Dispense</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="label">Feed Log (last 5)</div>
    <ul class="log" id="log"><li><span class="r">No entries yet</span></li></ul>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Enter passcode</h2>
    <input id="pass" type="password" autocomplete="off" placeholder="Passcode">
    <div class="err" id="err"></div>
    <div class="row">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="confirm" id="confirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    databaseURL: "https://dog-feeder-63c72-default-rtdb.firebaseio.com"
  });
  const db = firebase.database();
  const logsRef = db.ref("feed_logs");
  const MAX_LOGS = 5;
  const PASSCODE = "ADSB";

  let mode = "online";
  let revs = 1;
  const localLog = [];

  const $ = id => document.getElementById(id);
  const statusEl = $("status");

  function setStatus(msg){ statusEl.textContent = msg; }

  // Mode toggle
  function setMode(m){
    mode = m;
    $("modeOnline").classList.toggle("active", m === "online");
    $("modeOffline").classList.toggle("active", m === "offline");
    setStatus(m === "online" ? "" : "Offline: nothing is sent to the feeder.");
    renderLog();
  }
  $("modeOnline").onclick = () => setMode("online");
  $("modeOffline").onclick = () => setMode("offline");

  // Portion selector
  $("portions").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b) return;
    revs = parseInt(b.dataset.revs, 10);   // always a Number
    document.querySelectorAll("#portions button").forEach(x => x.classList.toggle("active", x === b));
  });

  // Dispense flow
  $("dispenseBtn").onclick = () => {
    if(mode === "offline"){
      localLog.unshift({ time: nowString(), revs: revs });
      localLog.length = Math.min(localLog.length, MAX_LOGS);
      renderLog();
      setStatus("Offline: logged locally only.");
      return;
    }
    $("pass").value = ""; $("err").textContent = "";
    $("overlay").classList.add("show");
    $("pass").focus();
  };
  $("cancelBtn").onclick = () => $("overlay").classList.remove("show");
  $("pass").addEventListener("keydown", e => { if(e.key === "Enter") submitPass(); });
  $("confirmBtn").onclick = submitPass;

  function nowString(){
    return new Date().toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }

  function submitPass(){
    if($("pass").value.trim().toUpperCase() !== PASSCODE){
      $("err").textContent = "Incorrect passcode";
      return;
    }
    $("overlay").classList.remove("show");
    pushFeed();
  }

  function pushFeed(){
    const entry = {
      time: String(nowString()),
      revs: Number(parseInt(revs, 10)),          // explicit integer 1, 2 or 3
      timestamp: firebase.database.ServerValue.TIMESTAMP
    };
    $("dispenseBtn").disabled = true;
    setStatus("Sending...");
    logsRef.push(entry)
      .then(() => { setStatus("Dispense sent (" + entry.revs + " rev" + (entry.revs > 1 ? "s" : "") + ")"); return trimLogs(); })
      .catch(err => setStatus("Error: " + err.message))
      .finally(() => setTimeout(() => { $("dispenseBtn").disabled = false; }, 1500));
  }

  // Keep at most MAX_LOGS entries (push keys sort chronologically)
  function trimLogs(){
    return logsRef.orderByKey().once("value").then(snap => {
      const keys = [];
      snap.forEach(c => { keys.push(c.key); });
      const extra = keys.length - MAX_LOGS;
      if(extra > 0){
        const updates = {};
        keys.slice(0, extra).forEach(k => { updates[k] = null; });
        return logsRef.update(updates);
      }
    });
  }

  // Live log
  let remote = [];
  logsRef.orderByKey().limitToLast(MAX_LOGS).on("value", snap => {
    remote = [];
    snap.forEach(c => { remote.push(c.val()); });
    remote.reverse();
    renderLog();
  });

  function renderLog(){
    const items = mode === "online" ? remote : localLog;
    const ul = $("log");
    ul.innerHTML = "";
    if(!items.length){ ul.innerHTML = '<li><span class="r">No entries yet</span></li>'; return; }
    items.forEach(it => {
      const li = document.createElement("li");
      const t = document.createElement("span");
      t.textContent = it.time;
      const r = document.createElement("span");
      r.className = "r" + (mode === "offline" ? " local" : "");
      r.textContent = it.revs + " rev" + (it.revs > 1 ? "s" : "");
      li.append(t, r);
      ul.appendChild(li);
    });
  }
</script>
</body>
</html>
